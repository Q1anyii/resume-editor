document.getElementById('btnExportHtml').onclick = exportHtml;

document.getElementById('btnImport').onclick = ()=> document.getElementById('fileImport').click();
document.getElementById('fileImport').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const s = JSON.parse(rd.result);
      if(!s.meta || !s.modules || !s.order) throw new Error('结构不匹配');
      const keepKey = (state.ai && state.ai.key) || '';
      state = s;
      state.layout = Object.assign({ fs: 9.3, lh: 1.55, gap: 10, editorW: 430, preset: 'standard', tpl: 'classic' }, state.layout || {});
      if(!state.theme) state.theme = 'navy';
      state.ai = Object.assign({ baseUrl: 'https://api.deepseek.com', model: 'deepseek-chat',
        key: '', jd: '', scope: 'all', systemPrompt: '' }, state.ai || {});
      if(!state.ai.key && keepKey) state.ai.key = keepKey;   // 导入的配置不带 key，沿用本机已存的
      state.meta = normalizeMeta(state.meta);                // 旧配置只有一行 contact，补成条目
      renderEditor(); renderPreview(); applyLayout(); applyZoom(); save();
      toast('配置已导入');
    }catch(err){ toast('导入失败：不是本工具导出的配置'); }
  };
  rd.readAsText(f, 'utf-8');
  e.target.value = '';
});

/* ---------- 导入已有简历 HTML：解析成 state ---------- */
/* 只认简历模板那套结构：h1 姓名 → 头部 3 个 p（求职意向 / 联系行 / 摘要）→ h2 分段，
   段内 h3 开项目、p 填信息与描述、ul/li 填 bullet（li 首个加粗 + 冒号视为小标题）。 */
function parseResumeHtml(text){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const squash = s => String(s || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
  const txt = el => squash(el ? el.textContent : '');
  /* 同 txt，但把内部 <strong>/<b> 还原成 ** 标记，保证导入后正文加粗还能编辑 */
  const richTxt = el => {
    if(!el) return '';
    const c = el.cloneNode(true);
    c.querySelectorAll('strong, b').forEach(s=> s.replaceWith('**' + s.textContent + '**'));
    return squash(c.textContent);
  };
  const lines = el => {
    const c = el.cloneNode(true);
    c.querySelectorAll('br').forEach(b=> b.replaceWith('\n'));
    return (c.textContent || '').split('\n').map(squash).filter(Boolean);
  };
  /* li 首个 strong/b 且紧跟冒号 → 当小标题 */
  const liLabel = li => {
    const first = li.firstElementChild;
    if(!first || !/^(STRONG|B)$/.test(first.tagName)) return '';
    const head = txt(first);
    const rest = (li.textContent || '').slice(head.length).trimStart();
    return /^[：:]/.test(rest) ? head : '';
  };
  const liItem = li => {
    const label = liLabel(li);
    const c = li.cloneNode(true);
    if(label && c.firstElementChild) c.firstElementChild.remove();
    c.querySelectorAll('strong, b').forEach(s=> s.replaceWith('**' + s.textContent + '**'));
    let t = squash(c.textContent);
    if(label) t = t.replace(/^[：:]\s*/, '');
    return { label, text: t };
  };

  const h1 = doc.querySelector('h1');
  if(!h1) throw new Error('没有找到姓名（<h1>）');

  /* 按文档顺序取出所有语义节点：简历外面套 main / div 都能读到，不依赖 body 的直接子元素 */
  const nodes = doc.body ? Array.from(doc.body.querySelectorAll('h1,h2,h3,p,ul,ol')) : [];

  const meta = { name: txt(h1), jobTitle: '', contact: '', summary: '' };
  const headPs = [];
  const h1At = nodes.indexOf(h1);
  for(let i = (h1At < 0 ? 0 : h1At + 1); i < nodes.length; i++){
    const tag = nodes[i].tagName.toUpperCase();
    if(tag === 'H2') break;
    if(tag === 'P') headPs.push(nodes[i]);
  }
  headPs.forEach(p=>{
    const t = txt(p);
    if(!t) return;
    if(!meta.jobTitle && /^(求职意向|意向岗位|应聘岗位|目标岗位|应聘意向|求职方向)/.test(t)){
      meta.jobTitle = t.replace(/^[^：:]{0,10}[：:]\s*/, '');
      return;
    }
    if(!meta.contact && /@|1[3-9]\d{9}|github\.com|www\.|https?:\/\//.test(t)){ meta.contact = t; return; }
    if(!meta.summary){ meta.summary = richTxt(p); return; }
    meta.summary += ' ' + richTxt(p);
  });

  const styleOf = t=>{
    if(/教育|学历/i.test(t)) return 'edu';
    if(/项目|作品|开源/i.test(t)) return 'project';
    if(/实习|工作|任职|实践经历/i.test(t)) return 'intern';
    if(/技能|证书|荣誉|奖项|语言|能力/i.test(t)) return 'list';
    return 'para';
  };

  const modules = {}; const order = []; let cur = null, seq = 0;

  const fill = (mod, el, tag)=>{
    const cls = (el.className || '').toString();
    if(tag === 'H3'){
      if(mod.style === 'project') mod.items.push({ name: txt(el), meta: '', stack: '', desc: '', bullets: [] });
      else mod.items.push({ label: '', text: txt(el) });
      return;
    }
    if(tag === 'P'){
      /* 摘要段可能排在模块之后（侧栏版式把摘要放主栏、技能放左栏），按 class 认出来，别落进模块条目里 */
      if(/summary/.test(cls)){
        const t = richTxt(el);
        if(t) meta.summary = meta.summary ? (meta.summary + ' ' + t) : t;
        return;
      }
      if(mod.style === 'project'){
        const it = mod.items[mod.items.length - 1];
        if(!it) return;
        if(/proj-desc|desc/i.test(cls)){ it.desc = richTxt(el); return; }
        /* 时间轴版式把时间藏在 code.tl-hide 里，这里取出来拼回 meta，导入才不丢时间 */
        const tlCode = el.querySelector('code.tl-hide');
        const tlTime = tlCode ? txt(tlCode) : '';
        if(!it.meta){
          const c = el.cloneNode(true);
          c.querySelectorAll('code').forEach(x=> x.remove());
          const ls = lines(c);
          const base = ls[0] || '';
          it.meta = tlTime ? (tlTime + (base ? ' ｜ ' + base : '')) : base;
          if(ls[1]) it.stack = ls[1];
          return;
        }
        if(!it.stack && el.querySelector('code') && !it.desc){ it.stack = txt(el); return; }
        if(!it.desc){ it.desc = richTxt(el); return; }
        return;
      }
      if(mod.style === 'edu'){
        const code = el.querySelector('code');
        const time = code ? txt(code) : '';
        const c = el.cloneNode(true);
        c.querySelectorAll('code').forEach(x=> x.remove());
        const text = richTxt(c).replace(/[｜|]\s*$/, '').trim();
        if(text) mod.items.push({ text, time });
        return;
      }
      if(mod.style === 'intern'){
        const code = el.querySelector('code');
        const time = code ? txt(code) : '';
        const c = el.cloneNode(true);
        c.querySelectorAll('code').forEach(x=> x.remove());
        const parts = squash(c.textContent).split(/[｜|]/).map(squash).filter(Boolean);
        mod.items.push({ company: parts[0] || '', role: parts[1] || '', time, bullets: [] });
        return;
      }
      const t = richTxt(el);
      if(t) mod.items.push({ label: '', text: t });
      return;
    }
    if(tag === 'UL' || tag === 'OL'){
      const lis = Array.from(el.querySelectorAll('li'));
      if(!lis.length) return;
      if(mod.style === 'project'){
        let it = mod.items[mod.items.length - 1];
        if(!it){ it = { name: '', meta: '', stack: '', desc: '', bullets: [] }; mod.items.push(it); }
        lis.forEach(li=> it.bullets.push(liItem(li)));
        return;
      }
      if(mod.style === 'intern'){
        let it = mod.items[mod.items.length - 1];
        if(!it){ it = { company: '', role: '', time: '', bullets: [] }; mod.items.push(it); }
        lis.forEach(li=> it.bullets.push(liItem(li)));
        return;
      }
      if(mod.style === 'list'){ lis.forEach(li=> mod.items.push(liItem(li))); return; }
      lis.forEach(li=>{
        const p = liItem(li);
        mod.items.push({ label: '', text: (p.label ? p.label + '：' : '') + p.text });
      });
    }
  };

  nodes.forEach(node=>{
    const tag = node.tagName.toUpperCase();
    if(tag === 'H1') return;
    if(tag === 'H2'){
      const title = txt(node) || ('模块 ' + (seq + 1));
      const id = 'm' + (++seq);
      cur = { title, style: styleOf(title), visible: true, items: [] };
      modules[id] = cur; order.push(id);
      return;
    }
    if(cur) fill(cur, node, tag);
  });

  meta.contacts = splitContacts(meta.contact);
  return { meta, modules, order };
}

document.getElementById('btnImportHtml').onclick = ()=> document.getElementById('fileHtml').click();
document.getElementById('fileHtml').addEventListener('change', e=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let parsed;
    try{ parsed = parseResumeHtml(String(rd.result || '')); }
    catch(err){ toast('解析失败：' + err.message); return; }
    const n = parsed.order.length;
    if(!n){ toast('没认出模块：这份 HTML 可能不是简历模板结构'); return; }
    const names = parsed.order.map(id=> parsed.modules[id].title).join(' / ');
    if(!confirm('解析到 ' + n + ' 个模块（' + names + '）\n将覆盖当前内容，排版与主题保留。继续？')) return;
    state.meta = normalizeMeta(Object.assign(
      { name: '', jobTitle: '', contact: '', summary: '', contacts: [] }, parsed.meta));
    state.modules = parsed.modules;
    state.order = parsed.order;
    state.ai.scope = 'all';
    renderEditor(); renderPreview(); applyLayout(); checkOverflow(); applyZoom(); save();
    toast('已导入：' + n + ' 个模块，' + parsed.order.reduce((s, id)=> s + (parsed.modules[id].items || []).length, 0) + ' 条内容');
  };
  rd.onerror = ()=> toast('读取失败：换个 .html 文件再试');
  rd.readAsText(f, 'utf-8');
});

/* ---------- 左右分隔条拖动 ---------- */
const splitterEl = document.getElementById('splitter');
const mainEl = document.querySelector('.main');
let splitDrag = false;

splitterEl.addEventListener('pointerdown', e=>{
  splitDrag = true;
  splitterEl.classList.add('dragging');
  splitterEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});
splitterEl.addEventListener('pointermove', e=>{
  if(!splitDrag) return;
  const left = mainEl.getBoundingClientRect().left;
  const limit = Math.min(860, Math.max(420, window.innerWidth - 430));
  const w = Math.min(Math.max(320, Math.round(e.clientX - left)), limit);
  state.layout.editorW = w;
  setEditorWidth(w);
  syncLabels();
  applyZoom();
});
function endSplit(){
  if(!splitDrag) return;
  splitDrag = false;
  splitterEl.classList.remove('dragging');
  save();
}
splitterEl.addEventListener('pointerup', endSplit);
splitterEl.addEventListener('pointercancel', endSplit);
splitterEl.addEventListener('lostpointercapture', endSplit);

/* =====================================================================
   9. 启动
   ===================================================================== */
renderEditor();
applyLayout();
renderPreview();
applyZoom();
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ applyZoom(); });
}
window.addEventListener('load', ()=> setTimeout(applyZoom, 60));
</script>
