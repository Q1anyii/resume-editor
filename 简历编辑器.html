<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历</title>
<style>
/* ===== 编辑器外壳 ===== */
*{box-sizing:border-box}
:root{
  --ink:#181a2b; --sub:#767c93; --line:#e7e8f2; --bg:#f2f3f8; --card:#fff;
  --brand:#6a54d8; --brand-2:#7f6ce6; --brand-soft:#f1eefc; --brand-ring:rgba(106,84,216,.16);
  --danger:#c8433a; --ok:#2f8a5a;
  --topbar-h:56px; --r:14px; --r-ctl:9px;
  --page-w:210mm; --page-h:297mm;
}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:13px;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

/* 顶栏 */
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 18px;
  background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
.brand::before{content:'';width:22px;height:22px;border-radius:7px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--brand) 0%,#8f7bf0 100%);
  box-shadow:0 2px 6px rgba(106,84,216,.28)}
.brand span{font-weight:500;font-size:11.5px;color:var(--sub);margin-left:2px;letter-spacing:.2px}
.spacer{flex:1}
.btn{height:34px;padding:0 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:var(--r-ctl);font-size:12.5px;font-weight:500;transition:.16s;display:inline-flex;
  align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:#cfc7f2;background:var(--brand-soft);color:var(--brand)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;
  box-shadow:0 2px 8px rgba(106,84,216,.24)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff;
  box-shadow:0 3px 12px rgba(106,84,216,.3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.ghost:hover{color:var(--brand);border-color:var(--line);background:var(--card)}
.btn.sm{height:27px;padding:0 9px;font-size:12px;border-radius:7px}
.file-input{display:none}

/* 主体 */
.main{display:flex;height:calc(100% - var(--topbar-h));overflow:hidden}

/* 左栏 */
.editor{width:var(--editor-w,430px);min-width:300px;max-width:860px;flex:0 0 auto;overflow-y:auto;padding:16px 16px 80px;
  background:var(--bg)}
.editor::-webkit-scrollbar{width:10px}
.editor::-webkit-scrollbar-thumb{background:#d8dbeb;border:3px solid var(--bg);border-radius:8px}

/* 最左侧模块跳转条 */
.rail{flex:0 0 54px;width:54px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 30px;
  overflow-y:auto;overflow-x:hidden}
.rail::-webkit-scrollbar{width:0}
.rail-btn{width:40px;min-height:36px;padding:6px 0;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--sub);font:inherit;font-size:11px;line-height:1.25;letter-spacing:.3px;
  cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;text-align:center}
.rail-btn:hover{background:#f6f5fd;color:var(--brand)}
.rail-btn.on{background:var(--brand-soft);border-color:#dcd4fa;color:var(--brand);font-weight:600}
.rail-tip{display:none;font-size:10px;color:var(--sub);padding:0 0 2px;text-align:center}

/* 左右分隔条（拖动改宽度） */
.splitter{flex:0 0 9px;width:9px;cursor:col-resize;background:var(--bg);position:relative;z-index:3}
.splitter::after{content:'';position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line);transition:.15s}
.splitter:hover::after,.splitter.dragging::after{background:var(--brand-2);width:2px;left:3.5px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(24,26,43,.04)}
.panel-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--card)}
.panel-title{font-weight:700;font-size:12.5px;color:var(--ink);letter-spacing:.2px}
.panel-body{padding:14px}

/* 「设置」大板块里的子板块：不重复卡片边框，只用一条细分隔线分开 */
.panel-sub{font-size:11px;color:#a3a8bd;letter-spacing:.3px}
.sub{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sub:first-child{border-top:0;padding-top:0;margin-top:0}
.sub.collapsed .panel-body{display:none}
.sub.collapsed .sub-head{padding-bottom:0}
.sub-head{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.sub-title{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.2px}
.sub.collapsed .sub-title{color:var(--sub)}
.sub.collapsed #btnLayoutReset{display:none}
/* 折叠按钮在白卡上太淡，给个浅底让它一眼看得见 */
.panel-head .ico.fold,.sub-head .ico{width:22px;height:22px;background:#f3f3fa;color:#767c93;border-radius:6px}
.panel-head .ico.fold:hover,.sub-head .ico:hover{background:var(--brand-soft);color:var(--brand)}

/* 右栏直接拖拽排序：可拖元素 + 落点指示线 */
#page [draggable="true"]{cursor:grab}
#page [draggable="true"]:active{cursor:grabbing}
#page .dragging{opacity:.38}
#page .drop-before,#page .drop-after{position:relative}
#page .drop-before::after,#page .drop-after::after{content:'';position:absolute;left:-4px;right:-4px;height:2px;
  background:var(--brand);border-radius:2px}
#page .drop-before::after{top:-2px}
#page .drop-after::after{bottom:-2px}

/* 拖拽时出现在列表末尾的投放条：拖到它上面 = 挪到最后 */
#page .drop-end{margin:5pt 0 2pt;padding:5.5pt 8pt;border:1pt dashed var(--accent-line);border-radius:3pt;
  background:var(--accent-bg);color:var(--ink-sub);font-size:calc(var(--fs) * .82);
  line-height:1.35;letter-spacing:.5px;text-align:center;cursor:copy}
#page .drop-end.drop-active{border-style:solid;border-color:var(--accent);background:var(--accent-bg);
  color:var(--accent-strong);font-weight:700}
#page .r-side .drop-end{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:rgba(255,255,255,.92)}
#page .r-side .drop-end.drop-active{border-color:#fff;color:#fff;background:rgba(255,255,255,.22)}

.field{margin-bottom:10px}
.f-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.f-head label{margin-bottom:0!important}
.bold-btn{flex:0 0 auto;width:23px;height:21px;line-height:1;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--ink);font-weight:700;font-size:12px;cursor:pointer;font-family:Georgia,serif}
.bold-btn:hover{border-color:#cfc7f2;color:var(--brand);background:var(--brand-soft)}
.field label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;letter-spacing:.4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-ctl);padding:7px 9px;
  font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--card);line-height:1.5;resize:vertical;
  transition:.15s}
.field input:hover,.field textarea:hover{border-color:#d5d0ef}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-ring)}
.field textarea{min-height:54px;resize:none;overflow:hidden}
.c-list{margin-bottom:6px}
.c-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.c-row select{flex:0 0 88px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:7px 5px;font-size:12px;
  color:var(--ink);background:var(--card);font-family:inherit}
.c-row select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-ring)}
.c-row input{width:auto;flex:1;min-width:0;margin:0}
.c-row .c-label{flex:0 0 76px}
.c-empty{font-size:11.5px;color:var(--sub);padding:2px 0 4px}

/* AI 说明与主题色块共用的小字 */
.ai-note{font-size:11px;color:var(--sub);line-height:1.6;margin-top:6px}

/* 主题色块 */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme-btn{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:8px 4px 7px;
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:.16s}
.theme-btn:hover{border-color:#d3ccf4;background:#fbfaff}
.theme-btn.on{border-color:#c3b7f1;box-shadow:0 0 0 3px var(--brand-ring);background:var(--brand-soft)}
.theme-dot{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.theme-name{font-size:10.5px;color:var(--sub);white-space:nowrap}
.theme-btn.on .theme-name{color:var(--brand);font-weight:600}

/* 排版调节滑块 */
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.slider-row label{flex:0 0 60px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.slider-row input[type=range]{flex:1;min-width:0;height:18px;accent-color:var(--brand);cursor:pointer}
.slider-row .val{flex:0 0 48px;text-align:right;font-size:11.5px;color:var(--brand);font-weight:600;
  font-variant-numeric:tabular-nums}

/* AI 对齐 JD */
.ai-grid{display:grid;gap:8px;margin-bottom:10px}
.ai-grid .f{display:flex;flex-direction:column;gap:4px}
.ai-grid .f label{font-size:10.5px;color:var(--sub);letter-spacing:.3px}
.ai-grid input,.ai-grid select{font-size:11.5px;padding:6px 8px}
.ai-note{font-size:10.5px;color:#8b90a6;line-height:1.55;margin:10px 0 8px}
.dchg{border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:9px;background:#fbfbfe}
.dchg-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.dchg-tag{font-size:10.5px;color:var(--brand);font-weight:600}
.dchg-reason{font-size:10.5px;color:#8b90a6;flex:0 0 auto}
.dchg-old{font-size:11px;color:#8b90a6;line-height:1.55}
.dchg-new{font-size:11px;color:#1f6b45;line-height:1.55;background:#f0f9f3;border:1px solid #d6ecdd;border-radius:7px;padding:5px 7px;margin-top:5px}
.dchg-acts{display:flex;gap:6px;margin-top:8px}
.dchg-acts .btn.sm{flex:1}
.ai-notes{font-size:10.5px;color:#8a6a1f;background:#fffaeb;border:1px solid #f4e5b4;
  border-radius:9px;padding:8px 10px;line-height:1.6;margin-bottom:10px}

/* 模块卡 */
.mod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;transition:.16s;
  box-shadow:0 1px 2px rgba(24,26,43,.04)}
.mod.dragging{opacity:.45}
.mod.over{border-color:#beb1f0;box-shadow:0 0 0 3px var(--brand-ring)}
.mod.off{opacity:.6}
.mod-head{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.handle{cursor:grab;color:#b6bacd;font-size:15px;line-height:1;padding:2px 3px;user-select:none}
.handle:active{cursor:grabbing}
.mod-name{flex:1;border:1px solid transparent;background:transparent;font-weight:700;font-size:13px;
  color:var(--ink);padding:4px 6px;border-radius:7px;font-family:inherit;min-width:0;letter-spacing:.2px}
.mod-name:hover{background:#f6f5fd;border-color:var(--line)}
.mod-name:focus{outline:none;background:var(--card);border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-ring)}
.tools{display:flex;gap:2px}
.ico{width:26px;height:26px;border:none;background:transparent;color:#a2a7bd;border-radius:7px;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;transition:.14s}
.ico:hover{background:#f2f0fb;color:var(--brand)}
.ico.del:hover{background:#fdeeee;color:var(--danger)}
.ico.ai{color:var(--brand-2)}
.ico.ai:hover{background:var(--brand-soft);color:var(--brand)}
.mod-body{padding:12px}
/* 折叠：模块卡片与通用面板共用 */
.mod.collapsed .mod-body{display:none}
.mod.collapsed .mod-head{border-bottom:none}
.panel.collapsed .panel-body{display:none}
.panel.collapsed .panel-head{border-bottom:none}
.ico.fold{color:#9297ad;font-size:12px}
.ico.fold:hover{background:#f2f0fb;color:var(--brand)}
.mod.collapsed .mod-head{background:#fbfbfe}
/* 条目（项目 / 经历 / 教育 / 段落）拖拽 */
.item-head{gap:6px}
.item-label{display:flex;align-items:center;gap:4px;min-width:0}
.ihandle{cursor:grab;color:#b6bacd;font-size:14px;line-height:1;padding:1px 3px;user-select:none}
.ihandle:active{cursor:grabbing}
.item.dragging,.bullet.dragging[data-item]{opacity:.45}
.item.over,.bullet.over[data-item]{border-color:#beb1f0;box-shadow:0 0 0 3px var(--brand-ring)}

.item{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:11px;background:#fbfbfe}
.item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.item-idx{font-size:10.5px;color:#8b90a6;letter-spacing:.8px;font-weight:600}
.item-acts{display:flex;gap:4px}
.bullets{margin-top:9px;border-top:1px dashed #e3e4ef;padding-top:9px}
.bullet{border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:9px;background:var(--card)}
.bullet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bullet-idx{font-size:10.5px;color:#a2a7bd;flex:0 0 auto;font-variant-numeric:tabular-nums}
.bh-left{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
/* 折叠时在标题行露一眼内容，免得收起后认不出是哪条 */
.bullet-peek{font-size:11.5px;color:#9aa0b6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bullet.dragging{opacity:.45}
.bullet.over{border-color:#beb1f0;box-shadow:0 0 0 3px var(--brand-ring)}
/* bullet 折叠 / 显隐 */
.bullet.collapsed{border-style:dashed;background:#fbfbfe}
.bullet.collapsed .bullet-body{display:none}
.bullet.collapsed .bullet-head{margin-bottom:0}
.bullet.off{opacity:.55;border-style:dashed}
.bullet.off .bullet-idx{text-decoration:line-through}
.bullet .ico{width:24px;height:24px;font-size:12px}
.b-acts{display:flex;align-items:center;gap:2px}
/* 拖拽：插入位置指示线 + 拖动期禁选中 */
.drop-line{position:fixed;left:0;height:3px;border-radius:2px;background:var(--brand);
  box-shadow:0 0 0 3px var(--brand-ring);pointer-events:none;z-index:40;display:none}
body.sorting{user-select:none;cursor:grabbing}
body.sorting .handle,body.sorting .ihandle,body.sorting .bhandle{cursor:grabbing}
/* 排版预设 */
.preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.preset-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 3px;
  font-size:11.5px;color:var(--sub);line-height:1.35;transition:.16s}
.preset-btn:hover{border-color:#d3ccf4;background:#fbfaff;color:var(--brand)}
.preset-btn.on{border-color:#c3b7f1;color:var(--brand);font-weight:600;
  box-shadow:0 0 0 3px var(--brand-ring);background:var(--brand-soft)}
.preset-btn small{display:block;font-size:9.5px;color:#9aa0b6;font-weight:400;letter-spacing:0}
/* 版式模板：按钮里画一个小缩略图，让「改的是版面」一眼可见 */
.tpl-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.tpl-btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 3px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);
  line-height:1.3;transition:.16s}
.tpl-btn:hover{border-color:#d3ccf4;background:#fbfaff;color:var(--brand)}
.tpl-btn.on{border-color:#c3b7f1;color:var(--brand);font-weight:600;
  box-shadow:0 0 0 3px var(--brand-ring);background:var(--brand-soft)}
.tpl-thumb{position:relative;width:32px;height:42px;border:1px solid #d5d3e8;border-radius:4px;
  background:#fff;overflow:hidden;flex:0 0 auto}
.tpl-thumb::before,.tpl-thumb::after{content:'';position:absolute}
.th-classic::before{left:3px;right:3px;top:4px;height:3px;background:#9d94c8}
.th-classic::after{left:3px;right:3px;top:11px;height:1px;background:#e0dff0;
  box-shadow:0 4px 0 #e0dff0,0 8px 0 #e0dff0,0 12px 0 #e0dff0,0 16px 0 #e0dff0,0 20px 0 #e0dff0}
.th-banner::before{left:0;right:0;top:0;height:13px;background:#8471de}
.th-banner::after{left:3px;right:3px;top:17px;height:1px;background:#e0dff0;
  box-shadow:0 4px 0 #e0dff0,0 8px 0 #e0dff0,0 12px 0 #e0dff0,0 16px 0 #e0dff0}
.th-sidebar::before{left:0;top:0;bottom:0;width:12px;background:#8471de}
.th-sidebar::after{left:16px;right:3px;top:4px;height:1px;background:#e0dff0;
  box-shadow:0 4px 0 #e0dff0,0 8px 0 #e0dff0,0 12px 0 #e0dff0,0 16px 0 #e0dff0,0 22px 0 #e0dff0}
.th-timeline::before{left:11px;top:5px;bottom:3px;width:1px;background:#9d94c8}
.th-timeline::after{left:14px;right:3px;top:6px;height:1px;background:#e0dff0;
  box-shadow:0 5px 0 #e0dff0,0 10px 0 #e0dff0,0 15px 0 #e0dff0,0 20px 0 #e0dff0}
.tpl-note{font-size:10.5px;color:#8b90a6;line-height:1.6;margin:-2px 0 10px}
/* AI 面板滚动 */
#aiResult{max-height:340px;overflow-y:auto;padding-right:4px;margin-top:4px}
#aiResult::-webkit-scrollbar{width:8px}
#aiResult::-webkit-scrollbar-thumb{background:#dcd9ee;border-radius:4px}
.ai-jd{height:96px;min-height:96px!important;max-height:96px;overflow-y:auto;resize:none}
.ai-sys{height:132px;min-height:132px!important;max-height:300px;overflow-y:auto;resize:vertical;
  font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11px;line-height:1.55}
.add-btn{width:100%;height:34px;border:1px dashed #cfc9ef;background:#faf9ff;color:var(--brand);
  border-radius:10px;font-size:12.5px;font-weight:600;transition:.16s}
.add-btn:hover{background:var(--brand-soft);border-color:#bdb2ee}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tip{font-size:11.5px;color:var(--sub);line-height:1.75;padding:12px 13px;background:#fbfbfe;
  border:1px dashed #deddf0;border-radius:12px}
.tip b{color:var(--brand)}

/* 右栏预览 */
.preview{flex:1;min-width:0;display:flex;flex-direction:column;background:#eceef4;overflow:hidden}
.pv-bar{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}
.pv-bar .warn{color:var(--danger);font-weight:600}
.pv-bar .ok{color:var(--ok)}
.pv-hint{font-size:11px;color:#a3a8bd;letter-spacing:.2px}

/* 点右侧板块 / 条目 / bullet 跳到左栏：目标卡闪一下 */
.mod.hit,.item.hit,.bullet.hit,.panel.hit{border-color:#c3b7f1;box-shadow:0 0 0 4px var(--brand-ring)}
.mod,.item,.bullet,.sub{scroll-margin-top:14px}
/* 悬停高亮只在屏幕上生效。打印/导出时鼠标可能正好停在纸面上，hover 会被一起打进 PDF，
   表现为整块淡紫底 —— 这类底色不该出现在投递件里，所以在打印媒介下直接不存在这条规则 */
@media screen{
  #page .r-sec{cursor:pointer;transition:background .15s}
  #page .r-sec:hover{background:rgba(106,84,216,.05)}
  #page li{cursor:pointer}
  #page li:hover,#page h3:hover{background:rgba(106,84,216,.06)}
}
/* 位图导出（html2canvas 克隆）期间冻结纸面：指针进不来，且任何悬停底色强制透明 */

<script>
/* =====================================================================
   0. 联系行：拆成「类型 + 内容」的条目，预览时再拼回一行
   ===================================================================== */
const CONTACT_KINDS = [
  { id: 'intent', label: '意向城市', prefix: '意向城市：' },
  { id: 'phone',  label: '电话',     prefix: '' },
  { id: 'email',  label: '邮箱',     prefix: '' },
  { id: 'github', label: 'GitHub',   prefix: 'GitHub: ' },
  { id: 'site',   label: '作品/主页', prefix: '作品：' },
  { id: 'custom', label: '自定义',   prefix: '' }
];
const kindOf = id => CONTACT_KINDS.find(k=> k.id === id) || CONTACT_KINDS[5];

/* 把一行联系信息按「｜」拆成条目，并按前缀/内容猜类型 */
function splitContacts(str){
  return String(str == null ? '' : str).split(/\s*｜\s*/).map(s=> s.trim()).filter(Boolean).map(seg=>{
    let m;
    if((m = seg.match(/^(?:意向城市|意向)[：:]\s*([\s\S]*)$/))) return { kind:'intent', label:'', text: m[1].trim() };
    if((m = seg.match(/^GitHub[：:]\s*([\s\S]*)$/i))) return { kind:'github', label:'', text: m[1].trim() };
    if((m = seg.match(/^(?:作品|主页|博客|网站|链接)[：:]\s*([\s\S]*)$/))) return { kind:'site', label:'', text: m[1].trim() };
    if(/^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(seg)) return { kind:'email', label:'', text: seg };
    if(/^1[3-9]\d{9}$/.test(seg)) return { kind:'phone', label:'', text: seg };
    if(/github\.com/i.test(seg)) return { kind:'github', label:'', text: seg };
    if(/^(?:https?:\/\/|www\.)/i.test(seg)) return { kind:'site', label:'', text: seg };
    return { kind:'custom', label:'', text: seg };
  });
}

/* 单条拼回文本：类型自带前缀，自定义用自己填的前缀 */
function contactLine(c){
  const t = String((c && c.text) || '').trim();
  if(!t) return '';
  const pre = c.kind === 'custom' ? String(c.label || '').trim() : kindOf(c.kind).prefix;
  if(!pre) return t;
  return /[：:]\s*$/.test(pre) ? pre + t : pre + '：' + t;
}

/* 条目 → meta.contact 字符串（预览、导出、AI 都用它） */
function syncContact(meta){
  meta = meta || state.meta;
  meta.contact = (meta.contacts || []).map(contactLine).filter(Boolean).join(' ｜ ');
  return meta.contact;
}

/* 补齐 meta.contacts：旧存档、导入的 JSON 只有一行字符串 */
function normalizeMeta(meta){
  if(!Array.isArray(meta.contacts) || !meta.contacts.length){
    meta.contacts = splitContacts(meta.contact);
  }
  meta.contacts.forEach(c=>{
    if(!CONTACT_KINDS.some(k=> k.id === c.kind)) c.kind = 'custom';
    if(c.label == null) c.label = '';
    if(c.text == null) c.text = '';
  });
  syncContact(meta);
  return meta;
}

const themeOf = id => THEMES.find(t=> t.id === id) || THEMES[0];

/* 排版预设：只改字号 / 行距 / 模块距，不动配色；主题与排版互不影响 */
const LAYOUT_PRESETS = [

  { id:'compact',  name:'紧凑', hint:'8.8pt / 1.42', layout:{ fs:8.8,  lh:1.42, gap:7  } },

];

/* 版式模板：动的是「页面骨架」——抬头位置、分栏、时间列，而不是字号行距。

const LAYOUT_TPLS = [
  { id:'classic',  name:'经典单栏', hint:'顶格抬头' },
  { id:'banner',   name:'横幅抬头', hint:'通栏色块' },

  { id:'timeline', name:'时间轴',   hint:'时间贴左列' }
];
const tplOf = id => LAYOUT_TPLS.find(t=> t.id === id);
function tplId(){
  const t = (state && state.layout && state.layout.tpl) || 'classic';
  return tplOf(t) ? t : 'classic';

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]
));
/* 把文本里的网址转成可点击链接：缺协议的自动补 https，其余内容照原样转义 */
function linkify(text){
  const s = String(text == null ? '' : text);
  const re = /(https?:\/\/[^\s｜，。）\)]+|github\.com\/[^\s｜，。）\)]+|www\.[^\s｜，。）\)]+)/gi;
  let out = '', last = 0, m;
  while((m = re.exec(s)) !== null){
    out += esc(s.slice(last, m.index));
    const url = /^https?:/i.test(m[0]) ? m[0] : 'https://' + m[0];
    out += '<a class="r-a" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(m[0]) + '</a>';
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  return out;
}
function richText(text){
  /* **加粗** 标记：可对任意片段自定义加粗；其余照旧识别链接 */
  const s = String(text == null ? "" : text);
  const parts = s.split(/\*\*(.+?)\*\*/g);
  if(parts.length === 1) return linkify(s);
  return parts.map((p, i)=> i % 2 ? "<strong>" + linkify(p) + "</strong>" : linkify(p)).join("");
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 1900);
}
function setPath(path, val){
  const parts = path.split('.');

  for(let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];

}

      <b>排版</b>：4 套预设（标准 / 紧凑 / 舒展 / 疏朗）只改字号、行距、模块距，与上面的版式、下面的主题配色互相独立；也能继续用滑块微调，微调后预设标记为「自定义」。<br>
      内容会自动存到本机浏览器，关掉再打开还在。<br>
      <b>自定义加粗</b>：任何多行内容里选中一段字，点右侧 <b>B</b> 按钮即加粗；也可以手写 <b>**文字**</b>。预览、PDF 导出、截图都按加粗显示。<br>
      <b>AI 对齐 JD</b>：填 Base URL / 模型 / Key，粘贴 JD，点「生成修改建议」，逐条采用即可。建议列表在框内滚动，不会把面板撑长。Key 只存在这台电脑，请求直连你填的端点，不经中转；<b>导出配置不含 Key</b>。<br>
      <b>导出 HTML</b>：把当前内容存成一份干净的简历网页——样式按当前字号 / 行距 / 主题一起写进去，双击就能看、可以直接当附件发；日后用「导入 HTML」还能读回来接着改。<br>
      <b>导出 PDF</b>：点右上角按钮 → 先弹大窗口看整页效果，确认后直接生成 PDF 文件（约 240dpi，不弹打印窗口）。<br>
      <b>打印 · 矢量</b>：要文字可选中、能被 ATS 解析的版本 → 打印窗口里「目标」选 <b>另存为 PDF</b>、纸张 A4、边距「无」。<br>
      右侧顶部若显示 <b>「超出 1 页」</b>，说明撑破了 A4，需精简几条 bullet 或换「紧凑」预设。
    </div>
  `);

  editorEl.innerHTML = wrap.join('');
  editorEl.scrollTop = keepTop;
  bindSortables();
  autoGrowAll();
  renderAiResult();
  renderRail();
}

function renderRail(){

/* 滚动时高亮当前所在板块（设置面板也算一块） */
function syncRailActive(){
  const railEl = document.getElementById('rail');
  if(!railEl) return;
  const ids = ['settings','meta'].concat(state.order.filter(id=> state.modules[id] && state.modules[id].visible));
  let active = ids[0];
  ids.forEach(id=>{
    const el = id === 'settings' ? document.getElementById('panelSettings') : document.getElementById('card-' + id);
    if(el && el.getBoundingClientRect().top <= 76) active = id;
  });
  railEl.querySelectorAll('.rail-btn').forEach(b=>{
    b.classList.toggle('on', b.dataset.jump === active);
  });
}

/* 把左栏滚到某块卡片的顶部；平滑滚动没动起来（部分环境忽略 smooth）就 900ms 后直接落位 */
function scrollCardIntoView(el){
  if(!el) return;
  const seq = ++jumpSeq;
  const before = editorEl.scrollTop;
  const top = Math.max(0, el.getBoundingClientRect().top - editorEl.getBoundingClientRect().top + before - 12);
  editorEl.scrollTo({ top, behavior: 'smooth' });
  setTimeout(()=>{
    if(seq !== jumpSeq) return;
    if(editorEl.scrollTop === before && top !== before) editorEl.scrollTop = top;
  }, 900);
}

(()=>{
  const railEl = document.getElementById('rail');
  if(!railEl) return;
  railEl.addEventListener('click', e=>{
    const b = e.target.closest('[data-jump]');
    if(!b) return;
    const jump = b.dataset.jump;
    if(jump === 'settings') scrollCardIntoView(document.getElementById('panelSettings'));
    else if(jump === 'meta') scrollCardIntoView(document.getElementById('card-meta'));
    else jumpToNode(jump, null, null);
    railEl.querySelectorAll('.rail-btn').forEach(x=> x.classList.toggle('on', x === b));
  });
  let ticking = false;
  editorEl.addEventListener('scroll', ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{ ticking = false; syncRailActive(); });
  });
})();

/* 采集可改写字段：只取措辞类文本；姓名、联系行、时间、项目名、公司角色等事实字段一律锁定 */
function collectFields(scope){
  const out = [];
  const add = (path, text, label) => {
    if(typeof text !== 'string' || !text.trim()) return;
    out.push({ path, text, label });
  };
  const include = id => scope === 'all' || scope === id;

  if(scope === 'all') add('meta.summary', state.meta.summary, '个人摘要');

  state.order.forEach(id=>{
    const m = state.modules[id];
    if(!m || !include(id)) return;
    (m.items || []).forEach((it, i)=>{
      const base = 'modules.' + id + '.items.' + i;
      const tag = m.title + ' · 第' + (i + 1) + '条';
      if(m.style === 'edu'){
        add(base + '.text', it.text, tag + ' · 学校专业行');
      } else if(m.style === 'project'){
        add(base + '.desc', it.desc, tag + ' · 一句话描述');
        add(base + '.stack', it.stack, tag + ' · 技术栈（只可重排不可新增）');
        (it.bullets || []).forEach((b, bi)=>{
          add(base + '.bullets.' + bi + '.label', b.label, tag + ' · bullet' + (bi + 1) + ' 小标题');
          add(base + '.bullets.' + bi + '.text', b.text, tag + ' · bullet' + (bi + 1) + ' 正文');
        });
      } else if(m.style === 'intern'){
        (it.bullets || []).forEach((b, bi)=>{
          add(base + '.bullets.' + bi + '.label', b.label, tag + ' · 要点' + (bi + 1) + ' 小标题');
          add(base + '.bullets.' + bi + '.text', b.text, tag + ' · 要点' + (bi + 1) + ' 正文');
        });
      } else if(m.style === 'list'){
        add(base + '.text', it.text, tag + ' · 「' + (it.label || '未命名') + '」正文');
      } else {
        add(base + '.text', it.text, tag + ' · 段落');
      }
    });
  });
  return out;
}

function parseAiJson(text){
  let t = String(text || '').trim();
  t = t.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '').trim();
  const i = t.indexOf('{'), j = t.lastIndexOf('}');
  if(i < 0 || j <= i) throw new Error('返回内容不是 JSON');
  return JSON.parse(t.slice(i, j + 1));
}

/* 兜底拦截：即使模型违规，也不让它写进口径红线与"全部部署"这类说法 */
const AI_BLOCKLIST = [
  /plan[\s-]*and[\s-]*execute/i,
  /任务规划/, /任务分解/, /多步规划/, /规划任务/,
  /两个项目.{0,6}(均|都).{0,8}部署/,
  /(均已|都已).{0,6}公网部署/
];

function sanitizeChanges(raw, fields){
  const map = new Map(fields.map(f=>[f.path, f]));
  const seen = new Set();
  const out = [];
  (raw || []).forEach(c=>{
    if(!c || typeof c.path !== 'string') return;
    const f = map.get(c.path);
    if(!f) return;                                       // path 不在清单里 → 丢弃
    if(seen.has(c.path)) return;                         // 同一字段只取第一条
    const nv = typeof c.newText === 'string' ? c.newText.trim() : '';
    if(!nv || nv === f.text) return;                     // 空或没变
    if(nv.length > 260) return;                          // 防止写成大段落
    if(AI_BLOCKLIST.some(re=> re.test(nv))) return;      // 口径红线兜底
    seen.add(c.path);
    out.push({ path: c.path, label: f.label, oldText: f.text, newText: nv,
      reason: String(c.reason || '').slice(0, 24) });
  });
  return out;
}

async function runAi(scope){
  const cfg = state.ai;
  if(!cfg.key || !cfg.key.trim()){ toast('先填 API Key（点右上角「API 设置」）'); aiCfgOpen = true; renderEditor(); return; }
  if(!cfg.jd || !cfg.jd.trim()){ toast('先把 JD 粘进来'); return; }

  const fields = collectFields(scope);
  if(!fields.length){ toast('这个范围没有可改写的内容'); return; }

  const scopeName = scope === 'all' ? '整份简历'
    : ((state.modules[scope] && state.modules[scope].title) || '该模块');
  const userMsg = [
    '【JD 原文】', cfg.jd.trim(), '',
    '【本次改写范围】' + scopeName, '',
    '【可改写字段清单】（path 必须原样复制，不得自造）',
    fields.map((f, i)=> '[' + (i + 1) + '] ' + f.path + '\n    位置：' + f.label + '\n    原文：' + f.text).join('\n\n')
  ].join('\n');

  const base = (cfg.baseUrl || '').trim().replace(/\/+$/, '');
  const endpoint = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
  const btn = document.getElementById('btnAiRun');
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '生成中…（约 10-30 秒）'; }
  const box = document.getElementById('aiResult');
  if(box) box.innerHTML = '<div class="ai-note">正在请求模型，请稍候…</div>';

  try{
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + cfg.key.trim()
      },
      body: JSON.stringify({
        model: (cfg.model || 'deepseek-chat').trim() || 'deepseek-chat',
        messages: [
          { role: 'system', content: activeSystemPrompt() },
          { role: 'user', content: userMsg }
        ],
        temperature: 0.3,
        max_tokens: 8192,
        response_format: { type: 'json_object' }
      })
    });

    if(!res.ok){
      let hint = 'HTTP ' + res.status;
      if(res.status === 401) hint = 'API Key 无效或已过期（401）';
      else if(res.status === 402) hint = '账户余额不足（402）';
      else if(res.status === 429) hint = '请求太频繁，等一两分钟再试（429）';
      else if(res.status === 404) hint = '端点不存在，检查 Base URL（404）';
      else if(res.status >= 500) hint = '服务端异常（' + res.status + '）';
      let detail = '';
      try{ const e = await res.json(); detail = (e && e.error && e.error.message) || ''; }catch(_){}
      throw new Error(hint + (detail ? '：' + detail : ''));
    }

    const data = await res.json();
    const content = data && data.choices && data.choices[0]
      && data.choices[0].message && data.choices[0].message.content;
    if(!content) throw new Error('返回内容为空');

    const parsed = parseAiJson(content);
    const changes = sanitizeChanges(parsed.changes, fields);
    const notes = (parsed.notes || []).filter(n=> typeof n === 'string' && n.trim())
      .slice(0, 5).map(n=> n.trim().slice(0, 60));

    aiResult = { changes, notes, scope };
    renderAiResult();
    if(changes.length) toast('生成 ' + changes.length + ' 条建议');
    else toast('模型认为当前内容已足够贴合');
  }catch(err){
    const msg = (err && err.message) || '未知错误';
    const isNet = /Failed to fetch|NetworkError|Load failed/i.test(msg);
    const isJson = /JSON/i.test(msg);
    const text = isNet ? '连不上接口：网络不通或被 CORS 拦截。确认 Base URL 可直连、网络正常'
      : isJson ? '模型返回的内容不是 JSON（可能被截断）。再点一次「生成修改建议」，或把范围改成单个模块'
      : msg;
    aiResult = null;
    const b2 = document.getElementById('aiResult');
    if(b2) b2.innerHTML = '<div class="ai-notes">生成失败：' + esc(text) + '</div>';
    toast('生成失败');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = old || '生成修改建议'; }
  }
}

function renderAiResult(){
  const box = document.getElementById('aiResult');
  if(!box) return;
  if(!aiResult){ box.innerHTML = ''; return; }

  let h = '';
  if(aiResult.notes && aiResult.notes.length){
    h += '<div class="ai-notes"><b>面试要准备的缺口</b><br>' + aiResult.notes.map(esc).join('<br>') + '</div>';
  }
  if(!aiResult.changes.length){
    h += '<div class="ai-note">没有可应用的改动。</div>';
    box.innerHTML = h;
    return;
  }
  h += '<div style="display:flex;gap:6px;margin-bottom:8px">'
    + '<button class="btn sm primary" id="btnAiApplyAll" style="flex:1">全部采用（' + aiResult.changes.length + '）</button>'
    + '<button class="btn sm" id="btnAiDrop" style="flex:0 0 78px">全部忽略</button></div>';
  h += aiResult.changes.map((c, i)=> `
    <div class="dchg">
      <div class="dchg-head"><span class="dchg-tag">${esc(c.label)}</span>
        <span class="dchg-reason">${esc(c.reason || '')}</span></div>
      <div class="dchg-old">${esc(c.oldText)}</div>
      <div class="dchg-new">${esc(c.newText)}</div>
      <div class="dchg-acts">
        <button class="btn sm primary" data-dchg="${i}">采用</button>
        <button class="btn sm" data-dchg="${i}" data-skip="1">忽略</button>
      </div>
    </div>`).join('');
  box.innerHTML = h;
}

/* ---------- 拖拽排序：pointer 事件 + 插入指示线 ---------- */
/* 三处共用一套引擎：
     module → state.order
     item   → state.modules[mid].items
     bullet → state.modules[mid].items[i].bullets（只在同一条目内；跨条目等于改事实）
   旧的 HTML5 DragEvent 方案 drop 后整栏重绘，会闪、会丢滚动位置、也看不出插到哪。
   现在手柄一按下就进入拖动，指针停在某个元素的上半 / 下半就决定「插它前面 / 后面」，
   用一条 3px 指示线给出落点，松手才写数据。 */

const dropLine = document.createElement('div');
dropLine.className = 'drop-line';
document.body.appendChild(dropLine);

let sortState = null;          /* {type, el, mid, i, els, target, moved} */

function sortEls(type, ctx){
  if(type === 'module') return Array.from(editorEl.querySelectorAll('.mod'));
  const modEl = editorEl.querySelector('.mod[data-mod="' + ctx.mid + '"]');
  if(!modEl) return [];
  if(type === 'item') return Array.from(modEl.querySelectorAll('[data-item]'));
  const itemEl = modEl.querySelector('[data-item="' + ctx.i + '"]');
  if(!itemEl) return [];
  return Array.from(itemEl.querySelectorAll('.bullet[data-bi]'));
}

function sortStart(e, type, ctx, el){
  if(e.button != null && e.button !== 0) return;
  if(sortState) return;
  e.preventDefault();
  e.stopPropagation();
  sortState = Object.assign({ type, el, els: sortEls(type, ctx), target: undefined, moved: false }, ctx);
  el.classList.add('dragging');
  document.body.classList.add('sorting');
  document.addEventListener('pointermove', sortMove);
  document.addEventListener('pointerup', sortEnd, true);
  document.addEventListener('pointercancel', sortEnd, true);
}

function sortMove(e){
  const s = sortState;
  if(!s) return;
  s.moved = true;
  const y = e.clientY;
  let target = null;                     /* null = 落到末尾 */
  for(const el of s.els){
    if(el === s.el) continue;
    const r = el.getBoundingClientRect();
    if(y < r.top + r.height / 2){ target = el; break; }
  }
  s.target = target;
  placeLine(target, s);
  autoScrollEditor(y);
}

function placeLine(target, s){
  const list = s.els.filter(el => el !== s.el);
  if(!list.length){ dropLine.style.display = 'none'; return; }
  const anchor = target || list[list.length - 1];
  const r = anchor.getBoundingClientRect();
  dropLine.style.display = 'block';
  dropLine.style.left = (r.left + 6) + 'px';
  dropLine.style.width = Math.max(40, r.width - 12) + 'px';
  dropLine.style.top = (target ? r.top - 2 : r.bottom - 1) + 'px';
}

/* 拖到左栏上下边缘时自动滚动，长列表也能拖到底 */
function autoScrollEditor(y){
  const box = editorEl.getBoundingClientRect();
  const edge = 64;
  if(box.height < 200) return;
  if(y < box.top + edge) editorEl.scrollTop -= 14;
  else if(y > box.bottom - edge) editorEl.scrollTop += 14;
}

function sortEnd(){
  const s = sortState;
  document.removeEventListener('pointermove', sortMove);
  document.removeEventListener('pointerup', sortEnd, true);
  document.removeEventListener('pointercancel', sortEnd, true);
  dropLine.style.display = 'none';
  document.body.classList.remove('sorting');
  sortState = null;
  if(!s) return;
  s.el.classList.remove('dragging');
  if(!s.moved || s.target === undefined) return;

  const els = s.els;
  const from = els.indexOf(s.el);
  if(from < 0) return;
  let to;
  if(s.target === null){
    to = els.length - 1;                 /* 末尾 */
  } else {
    const ti = els.indexOf(s.target);
    if(ti < 0) return;
    to = (from < ti) ? ti - 1 : ti;      /* 先抽走自己再插到 target 之前 */
  }
  if(from === to) return;
  applySort(s, from, to);
}

function applySort(s, from, to){
  let arr = null;
  if(s.type === 'module'){
    arr = state.order;
  } else if(s.type === 'item'){
    const m = state.modules[s.mid];
    arr = m && m.items;
  } else {
    const m = state.modules[s.mid];
    const it = m && m.items && m.items[s.i];
    arr = it && it.bullets;
  }
  if(!arr || from >= arr.length || to >= arr.length) return;
  const [x] = arr.splice(from, 1);
  arr.splice(to, 0, x);
  renderEditor(); renderPreview(); checkOverflow(); applyZoom(); renderRail(); save();
}

/* 给三种手柄接线：模块标题的 ⠿、条目左侧的 ⠿、bullet 左侧的 ⠿ */
function bindSortables(){
  editorEl.querySelectorAll('.mod').forEach(modEl=>{
    const mid = modEl.dataset.mod;
    const h = modEl.querySelector('.mod-head .handle');
    if(h) h.addEventListener('pointerdown', e=> sortStart(e, 'module', { mid }, modEl));
  });
  editorEl.querySelectorAll('.ihandle').forEach(h=>{
    const el = h.closest('[data-item]');
    const modEl = el && el.closest('.mod');
    if(!el || !modEl) return;
    h.addEventListener('pointerdown', e=> sortStart(e, 'item', { mid: modEl.dataset.mod, i: +el.dataset.item }, el));
  });
  editorEl.querySelectorAll('.bhandle').forEach(h=>{
    const el = h.closest('.bullet[data-bi]');
    const modEl = el && el.closest('.mod');
    if(!el || !modEl) return;
    h.addEventListener('pointerdown', e=> sortStart(e, 'bullet', { mid: modEl.dataset.mod, i: +el.dataset.i }, el));
  });
}

/* =====================================================================
   5. 右侧预览渲染
   ===================================================================== */
const pageEl = document.getElementById('page');

/* 文件名 / 标签页标题统一规则：姓名-求职意向-简历（求职意向只取 ｜ 之前那一段） */
function resumeFileName(){
  const pos = String((state.meta && state.meta.jobTitle) || '').split(/[｜|]/)[0].trim();
  return [(state.meta && state.meta.name) || '简历', pos, '简历'].filter(Boolean).join('-');
}
/* 打印「另存为 PDF」时浏览器默认拿文档标题当文件名，所以标题要跟着简历内容走 */
function syncDocTitle(){
  const t = resumeFileName();
  if(document.title !== t) document.title = t;
}

/* ---------- 简历正文（预览与「导出 HTML」共用这一套生成逻辑） ---------- */
/* 时间轴版式要把「20XX.XX – 20XX.XX ｜ 其余信息」里的时间拆到左侧列 */
function splitTime(str){
  const s = String(str == null ? '' : str).trim();
  const parts = s.split(/\s*｜\s*/);
  const first = (parts[0] || '').trim();
  if(/^(?:\d{4}|19\d{2}|20XX)/.test(first)){
    parts.shift();
    return { time: first, rest: parts.join(' ｜ ') };
  }
  return { time: '', rest: s };
}
/* 每根 bullet 记住自己在 bullets 里的原索引（data-bi），右栏点击 / 拖拽都靠它定位 */
function ulHtml(list){
  const on = (list || []).map((b, bi)=>({ b, bi })).filter(x=> x.b.visible !== false);   /* 隐藏的 bullet 不进正文 */
  if(!on.length) return '';
  return '<ul class="r-ul">' + on.map(x=>
    '<li data-bi="' + x.bi + '" draggable="true">' + (x.b.label ? '<strong class="r-strong">' + esc(x.b.label) + '</strong>：' : '') + richText(x.b.text || '') + '</li>'
  ).join('') + '</ul>';
}
/* 时间轴的一格：左列时间、右列内容。时间同时在正文里留一份隐藏 code，导入时才不会丢 */
function tlWrap(time, inner){
  return '<div class="r-tl-item"><div class="r-tl-time">' + esc(time || '') + '</div>'
    + '<div class="r-tl-body">' + inner + '</div></div>';
}
/* 每个条目外面包一层 .r-item：它只是定位与拖拽用的空壳，不带任何样式，不影响原有间距 */
const itemWrap = (i, inner) => '<div class="r-item" data-item="' + i + '" draggable="true">' + inner + '</div>';

function modHtml(mod, tpl){
  const tl = tpl === 'timeline';
  let body = '';

  if(mod.style === 'edu'){
    (mod.items || []).forEach((it, i)=>{
      const code = it.time ? '<code class="r-code' + (tl ? ' tl-hide' : '') + '">' + esc(it.time) + '</code>' : '';
      const p = '<p class="r-p">' + richText(it.text || '') + (it.time ? (tl ? code : ' ｜ ' + code) : '') + '</p>';
      body += tl ? tlWrap(it.time, itemWrap(i, p)) : itemWrap(i, p);
    });
  } else if(mod.style === 'project'){
    (mod.items || []).forEach((it, i)=>{
      const st = tl ? splitTime(it.meta) : { time: '', rest: it.meta || '' };
      let s = '';
      if(it.name) s += '<h3 class="r-h3">' + esc(it.name) + '</h3>';
      /* meta 与 stack 写进同一个 p、用 br 分两行：导入时按 br 拆回两段，不会被当成描述 */
      if(it.meta || it.stack || st.time){
        const seg = [];
        if(st.rest)  seg.push(richText(st.rest));
        if(it.stack) seg.push('<span class="r-code">' + esc(it.stack) + '</span>');
        s += '<p class="r-meta">' + seg.join('<br>')
           + (tl && st.time ? '<code class="r-code tl-hide">' + esc(st.time) + '</code>' : '') + '</p>';
      }
      if(it.desc)  s += '<p class="r-desc">' + richText(it.desc) + '</p>';
      s += ulHtml(it.bullets);
      const inner = itemWrap(i, s);
      body += tl ? tlWrap(st.time, inner) : inner;
    });
  } else if(mod.style === 'intern'){
    (mod.items || []).forEach((it, i)=>{
      let head = '<p class="r-p"><strong class="r-strong">' + esc(it.company || '') + '</strong>';
      if(it.role) head += ' ｜ ' + esc(it.role);
      if(it.time) head += tl ? '<code class="r-code tl-hide">' + esc(it.time) + '</code>'
                             : ' ｜ <code class="r-code">' + esc(it.time) + '</code>';
      head += '</p>';
      const inner = itemWrap(i, head + ulHtml(it.bullets));
      body += tl ? tlWrap(it.time, inner) : inner;
    });
  } else if(mod.style === 'list'){
    const on = (mod.items || []).map((it, i)=>({ it, i })).filter(x=> x.it.visible !== false);
    if(on.length) body = '<ul class="r-ul">' + on.map(x=>
      '<li data-item="' + x.i + '" draggable="true">' + (x.it.label ? '<strong class="r-strong">' + esc(x.it.label) + '</strong>：' : '') + richText(x.it.text || '') + '</li>'
    ).join('') + '</ul>';
  } else {
    (mod.items || []).forEach((it, i)=>{
      body += itemWrap(i, '<p class="r-p">' + richText(it.text || '') + '</p>');
    });
  }

  if(!body) return '';
  return '<h2 class="r-h2" draggable="true">' + esc(mod.title) + '</h2>' + body;
}
function headParts(){
  const m = state.meta || {};
  return {
    name:    '<h1 class="r-name">' + esc(m.name || '') + '</h1>',
    title:   m.jobTitle ? '<p class="r-title">求职意向：' + esc(m.jobTitle) + '</p>' : '',
    contact: m.contact  ? '<p class="r-contact">' + richText(m.contact) + '</p>' : '',
    summary: m.summary  ? '<p class="r-summary">' + richText(m.summary) + '</p>' : ''
  };
}
/* 版式只决定「哪块内容放哪儿」，文字与语义标签四套一致 —— 导出、PDF、导入都还能接着用 */
function buildBody(tpl){
  const H = headParts();
  /* 带上模块 id：右侧每个板块记住自己是谁，点它就能让左栏跳到对应卡片 */
  const mods = state.order
    .map(id=>{ const mo = state.modules[id]; return mo && mo.visible ? Object.assign({}, mo, { sid: id }) : null; })
    .filter(Boolean);
  /* 每个模块套一层 r-sec：其余版式这层容器透明、不影响原先的间距与折叠 */
  const all = list => list.map(mo=> '<section class="r-sec" data-sec="' + mo.sid + '">' + modHtml(mo, tpl) + '</section>').join('');

  if(tpl === 'sidebar'){
    const side = mods.filter(mo=> mo.style === 'list');   /* 技能类进左栏，其余走主栏 */
    const rest = mods.filter(mo=> mo.style !== 'list');
    return '<div class="r-cols">'
      + '<aside class="r-side">' + H.name + H.title + H.contact + all(side) + '</aside>'
      + '<main class="r-body">' + H.summary + all(rest) + '</main>'
      + '</div>';
  }
  if(tpl === 'banner'){
    return '<header class="r-head">' + H.name + H.title + H.contact + '</header>'
      + H.summary + all(mods);
  }
  return H.name + H.title + H.contact + H.summary + all(mods);
}

function renderPreview(){
  pageEl.innerHTML = buildBody(tplId());
  checkOverflow();
  syncDocTitle();          /* 姓名 / 求职意向一改，浏览器标签页与打印默认文件名同步 */
}

/* ---------- 点右侧简历里的板块 / 条目 / bullet → 左侧跳到具体位置 ----------
   收起着的模块先展开（不然跳过去只有一个标题），折叠的 bullet 也展开；跳完短暂高亮。
   平滑滚动若在 900ms 内完全没动静（部分环境会忽略 smooth），直接落到目标位置兜底。 */
let jumpSeq = 0;
function jumpToNode(mid, i, bi){
  if(!mid || !state.modules[mid]) return;
  const seq = ++jumpSeq;                  /* 连点不同目标时，旧的那次兜底不再抢滚动 */
  state.ui = state.ui || {};
  let redraw = false;
  /* 展开 = 把对应的折叠标记删掉，比连调两次 toggleFold 少闪一帧 */
  if(isFold('m-' + mid)){ delete state.ui['f:m-' + mid]; redraw = true; }
  if(i != null && bi != null && isFold('b:' + mid + ':' + i + ':' + bi)){
    delete state.ui['f:b:' + mid + ':' + i + ':' + bi];
    redraw = true;
  }
  if(redraw){ renderEditor(); save(); }
  let el = document.getElementById('card-' + mid);
  if(el && i != null){
    el = el.querySelector('.mod-body [data-item="' + i + '"]') || el;
    if(bi != null){
      const b = el.querySelector('.bullet[data-bi="' + bi + '"]');
      if(b) el = b;
    }
  }
  if(!el) return;
  const before = editorEl.scrollTop;
  const top = el.getBoundingClientRect().top - editorEl.getBoundingClientRect().top + before - 14;
  editorEl.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  setTimeout(()=>{
    if(seq !== jumpSeq) return;
    if(editorEl.scrollTop === before && Math.max(0, top) !== before) editorEl.scrollTop = Math.max(0, top);
  }, 900);
  el.classList.remove('hit');
  void el.offsetWidth;                              /* 断开动画，连点同一块也能再闪一次 */
  el.classList.add('hit');
  setTimeout(()=> el.classList.remove('hit'), 1600);
}

/* 解析一个预览元素指向哪里：模块 / 条目 / bullet 三级 */
function targetOf(el){
  const sec = el.closest('[data-sec]');
  if(!sec) return null;
  const mid = sec.getAttribute('data-sec');
  const bullet = el.closest('[data-bi]');
  const item = el.closest('[data-item]');
  return {
    mid,
    i: item ? Number(item.getAttribute('data-item')) : null,
    bi: bullet ? Number(bullet.getAttribute('data-bi')) : null
  };
}

pageEl.addEventListener('click', e=>{
  const t = targetOf(e.target);
  if(t) jumpToNode(t.mid, t.i, t.bi);
});

/* ---------- 右边直接拖：模块 / 条目 / bullet 三级，松手后左栏跟着变 ----------
   拖动时在目标上方或下方画一条插入线；落点按鼠标在目标垂直中线的前后判断。 */
let dragCtx = null;

const dragKindOf = el => {
  if(el.matches('h2.r-h2')) return 'mod';
  if(el.matches('li[data-bi]')) return 'bullet';
  if(el.matches('[data-item]')) return 'item';
  return null;
};

pageEl.addEventListener('dragstart', e=>{
  const h = e.target.closest('h2.r-h2, li[data-bi], [data-item]');
  if(!h) return;
  const kind = dragKindOf(h);
  if(!kind) return;
  const t = targetOf(h);
  if(!t) return;
  dragCtx = Object.assign({ kind, el: h }, t);
  h.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', kind); }catch(_){}
  addDropEnd();        /* 列表末尾放一条「拖到这里 = 放到最后」的投放条 */
});

function clearDropMarks(){
  pageEl.querySelectorAll('.drop-before,.drop-after,.drop-active').forEach(x=>{
    x.classList.remove('drop-before','drop-after','drop-active');
  });
}

const secOf = mid => pageEl.querySelector('[data-sec="' + mid + '"]');
const itemOf = (mid, i) => {
  const sec = secOf(mid);
  return sec ? sec.querySelector('[data-item="' + i + '"]') : null;
};

/* 投放条只在拖拽期间存在：拖到它上面，就把东西挪到这一级的最后 */
function addDropEnd(){
  removeDropEnd();
  if(!dragCtx) return;
  const d = document.createElement('div');
  d.className = 'drop-end';
  d.textContent = '拖到这里 → 放到最后';
  let host = null;
  if(dragCtx.kind === 'mod') host = pageEl;
  else if(dragCtx.kind === 'item') host = secOf(dragCtx.mid);
  else host = itemOf(dragCtx.mid, dragCtx.i);
  if(!host) return;
  host.appendChild(d);
  dragCtx.endEl = d;
}
function removeDropEnd(){
  pageEl.querySelectorAll('.drop-end').forEach(d=> d.remove());
  if(dragCtx) dragCtx.endEl = null;
}

/* 这个元素能不能接住当前拖的东西；能接就返回落点（落在目标之前 / 之后） */
function acceptTarget(el, y){
  if(!dragCtx || !el) return null;
  if(el === dragCtx.el || el.contains(dragCtx.el)) return null;
  const kind = dragKindOf(el);
  if(kind !== dragCtx.kind) return null;
  const t = targetOf(el);
  if(!t) return null;
  /* 只接受同一层级的落点：模块对模块（跨模块才算换位）、条对条、bullet 对同一条目里的 bullet */
  if(kind === 'mod'){
    if(t.mid === dragCtx.mid) return null;
  } else {
    if(t.mid !== dragCtx.mid) return null;
    if(kind === 'bullet' && (t.i !== dragCtx.i || t.bi === dragCtx.bi)) return null;
  }
  const box = el.getBoundingClientRect();
  return { el, t, after: y > box.top + box.height / 2 };
}

/* 落在缝隙、模块之间、纸面下方这类空白处时，按鼠标高度找最近的同类位置 */
function nearestByY(y){
  const kind = dragCtx.kind;
  if(kind === 'mod'){
    const secs = Array.from(pageEl.querySelectorAll('[data-sec]'));
    for(const s of secs){
      const h2 = s.querySelector('h2.r-h2');
      if(!h2) continue;
      if(y < h2.getBoundingClientRect().bottom) return acceptTarget(h2, y);
    }
    const lastH2 = secs.length ? secs[secs.length - 1].querySelector('h2.r-h2') : null;
    return lastH2 ? acceptTarget(lastH2, 1e6) : null;
  }
  if(kind === 'item'){
    const sec = secOf(dragCtx.mid);
    if(!sec) return null;
    const items = Array.from(sec.querySelectorAll('[data-item]'));
    for(const it of items){
      if(y < it.getBoundingClientRect().bottom) return acceptTarget(it, y);
    }
    return items.length ? acceptTarget(items[items.length - 1], 1e6) : null;
  }
  const item = itemOf(dragCtx.mid, dragCtx.i);
  if(!item) return null;
  const lis = Array.from(item.querySelectorAll('li[data-bi]'));
  for(const li of lis){
    if(y < li.getBoundingClientRect().bottom) return acceptTarget(li, y);
  }
  return lis.length ? acceptTarget(lis[lis.length - 1], 1e6) : null;
}

function markDrop(hit){
  clearDropMarks();
  hit.el.classList.add(hit.after ? 'drop-after' : 'drop-before');
  dragCtx.dropEl = hit.el;
  dragCtx.dropTarget = hit.t;
  dragCtx.dropAfter = hit.after;
  dragCtx.dropEnd = false;
}
function markEnd(el){
  clearDropMarks();
  if(el) el.classList.add('drop-active');
  dragCtx.dropEnd = true;
  dragCtx.dropTarget = null;
  dragCtx.dropEl = null;
}

pageEl.addEventListener('dragover', e=>{
  if(!dragCtx) return;
  const endEl = e.target.closest ? e.target.closest('.drop-end') : null;
  if(endEl){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    markEnd(endEl);
    return;
  }
  let hit = acceptTarget(e.target.closest ? e.target.closest('h2.r-h2, li[data-bi], [data-item]') : null, e.clientY);
  if(!hit) hit = nearestByY(e.clientY);       /* 行间缝隙、模块之间、纸面下方：按高度兜底 */
  if(!hit) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  markDrop(hit);
});

pageEl.addEventListener('dragleave', e=>{
  if(!dragCtx) return;
  if(e.relatedTarget && pageEl.contains(e.relatedTarget)) return;
  clearDropMarks();
});

function commitDrop(){
  if(!dragCtx) return false;
  const { kind, mid } = dragCtx;
  const m = state.modules[mid];
  if(dragCtx.dropEnd){                        /* 置底：直接挪到这一级的最后 */
    if(kind === 'mod'){
      const from = state.order.indexOf(mid);
      const last = state.order.length - 1;
      return from >= 0 && from !== last ? moveInArray(state.order, from, last, true) : false;
    }
    if(kind === 'item'){
      if(!m || !m.items) return false;
      return dragCtx.i !== m.items.length - 1 ? moveInArray(m.items, dragCtx.i, m.items.length - 1, true) : false;
    }
    const it = m && m.items && m.items[dragCtx.i];
    if(!it || !it.bullets) return false;
    return dragCtx.bi !== it.bullets.length - 1 ? moveInArray(it.bullets, dragCtx.bi, it.bullets.length - 1, true) : false;
  }
  const target = dragCtx.dropTarget;
  if(!target) return false;
  const after = !!dragCtx.dropAfter;
  if(kind === 'mod') return moveInArray(state.order, state.order.indexOf(mid), state.order.indexOf(target.mid), after);
  if(kind === 'item') return m ? moveInArray(m.items, dragCtx.i, target.i, after) : false;
  const it = m && m.items && m.items[dragCtx.i];
  return it ? moveInArray(it.bullets, dragCtx.bi, target.bi, after) : false;
}

pageEl.addEventListener('drop', e=>{
  if(!dragCtx) return;
  e.preventDefault();
  const changed = commitDrop();
  finishDrag();
  if(changed){ renderEditor(); renderPreview(); save(); }
});

/* 拖到纸面外面的空白处（A4 页下方）：也当作「放到最后」 */
const pvArea = document.getElementById('pvScroll');
if(pvArea){
  pvArea.addEventListener('dragover', e=>{
    if(!dragCtx || pageEl.contains(e.target)) return;
    if(dragCtx.kind !== 'mod') return;
    if(!dragCtx.endEl) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    markEnd(dragCtx.endEl);
  });
  pvArea.addEventListener('drop', e=>{
    if(!dragCtx || pageEl.contains(e.target)) return;
    if(dragCtx.kind !== 'mod' || !dragCtx.endEl) return;
    e.preventDefault();
    markEnd(dragCtx.endEl);
    const changed = commitDrop();
    finishDrag();
    if(changed){ renderEditor(); renderPreview(); save(); }
  });
}

pageEl.addEventListener('dragend', finishDrag);

function finishDrag(){
  if(dragCtx && dragCtx.el) dragCtx.el.classList.remove('dragging');
  clearDropMarks();
  removeDropEnd();
  dragCtx = null;
}

/* 把 from 处的元素移到 target 的位置（after = 落在目标之后） */
function moveInArray(arr, from, target, after){
  if(!arr || from == null || target == null || from === target) return false;
  if(from < 0 || from >= arr.length || target < 0 || target >= arr.length) return false;
  let insert = target + (after ? 1 : 0);
  if(from < insert) insert -= 1;
  const item = arr.splice(from, 1)[0];
  arr.splice(insert, 0, item);
  return true;
}

/* 把排版参数写到 CSS 变量上 */
function applyLayout(){
  const L = state.layout || { fs: 9.3, lh: 1.55, gap: 10, editorW: 430 };
  pageEl.style.setProperty('--fs', L.fs + 'pt');
  pageEl.style.setProperty('--lh', String(L.lh));
  pageEl.style.setProperty('--gap', L.gap + 'pt');
  syncTplClass();
  setEditorWidth(L.editorW);
  applyTheme();
}

/* 版式落成 page 上的 class：tpl-banner / tpl-sidebar / tpl-timeline，经典单栏不加 class */
function syncTplClass(){
  const tpl = tplId();
  ['tpl-banner','tpl-sidebar','tpl-timeline'].forEach(c=> pageEl.classList.remove(c));
  if(tpl !== 'classic') pageEl.classList.add('tpl-' + tpl);
}

/* 左栏宽度（分隔条拖动与滑块共用） */
function setEditorWidth(w){
  const v = Math.min(860, Math.max(300, Number(w) || 430));
  document.documentElement.style.setProperty('--editor-w', v + 'px');
}

/* 主题色 = A4 页面上的 CSS 变量 */
function applyTheme(){
  const t = themeOf(state.theme);
  pageEl.style.setProperty('--accent', t.accent);
  pageEl.style.setProperty('--accent-deep', t.deep);
  pageEl.style.setProperty('--accent-strong', t.strong);
  pageEl.style.setProperty('--accent-bg', t.bg);
  pageEl.style.setProperty('--ink-main', t.ink);
  pageEl.style.setProperty('--ink-sub', t.sub);
  pageEl.style.setProperty('--ink-soft', t.soft);
  pageEl.style.setProperty('--accent-line', t.accent + '3d');   /* 由主题色派生的淡分隔线 */
}

/* 同步滑块右侧数值 */
function syncLabels(){
  const L = state.layout || { fs: 9.3, lh: 1.55, gap: 10, editorW: 430 };
  const a = document.getElementById('valFs');
  const b = document.getElementById('valLh');
  const c = document.getElementById('valGap');
  const d = document.getElementById('valW');
  if(a) a.textContent = L.fs.toFixed(1) + 'pt';
  if(b) b.textContent = L.lh.toFixed(2);
  if(c) c.textContent = L.gap.toFixed(1) + 'pt';
  if(d) d.textContent = Math.round(L.editorW || 430) + 'px';
}

/* 超页检测：临时去掉 min-height，量出内容真实高度 */
function checkOverflow(){
  const A4_PX = 297 / 25.4 * 96;                  // ≈ 1122.5px
  const prev = pageEl.style.minHeight;
  pageEl.classList.add('measuring');              /* 侧栏「撑满一页」的写法此时要让开 */
  pageEl.style.minHeight = '0px';
  const h = pageEl.offsetHeight;
  pageEl.style.minHeight = prev;
  pageEl.classList.remove('measuring');
  const el = document.getElementById('pageState');
  if(h > A4_PX + 2){
    const over = Math.round((h - A4_PX) / 96 * 72);
    el.className = 'warn';
    el.textContent = '超出 1 页约 ' + over + 'pt，请精简';
  } else {
    el.className = 'ok';
    el.textContent = '单页 · 余 ' + Math.round((A4_PX - h) / 96 * 72) + 'pt';
  }
}

/* =====================================================================
   6. 交互：输入 / 按钮 / 增删
   ===================================================================== */
editorEl.addEventListener('input', e=>{
  const t = e.target;
  const p = t.dataset.path;
  if(!p) return;

  /* 排版滑块：只改变量与量尺，不重建预览，拖动手感才跟得上 */
  if(t.type === 'range'){
    setPath(p, parseFloat(t.value));
    if(p !== 'layout.editorW'){
      state.layout.preset = 'custom';                 /* 手动改过就不再算某个预设 */
      editorEl.querySelectorAll('.preset-btn.on').forEach(b=> b.classList.remove('on'));
    }
    applyLayout(); syncLabels(); checkOverflow(); applyZoom(); save();
    return;
  }

  const val = (t.type === 'checkbox') ? t.checked : t.value;
  setPath(p, val);

  /* AI 配置与 JD：只存盘，不触发预览重绘 */
  if(p.indexOf('ai.') === 0){
    if(p === 'ai.systemPrompt') syncSysState();   /* 只更新「当前生效」那行，不重建输入框 */
    save(); return;
  }

  /* 联系行条目：改完单项立刻拼回 meta.contact，预览才跟着变 */
  if(p.indexOf('meta.contacts.') === 0) syncContact();

  if(t.tagName === 'TEXTAREA' && !t.classList.contains('ai-jd')){
    t.style.height = 'auto';
    t.style.height = Math.max(t.scrollHeight + 2, 46) + 'px';
  }
  renderPreview();
  save();
});

/* 自定义加粗：选中文字 → 包成 **文字**，预览与导出都按加粗渲染 */
editorEl.addEventListener('click', e=>{
  const b = e.target.closest('.bold-btn');
  if(!b) return;
  const path = b.dataset.bold;
  const ta = editorEl.querySelector('textarea[data-path="' + path + '"]');
  if(!ta) return;
  const s0 = ta.selectionStart, s1 = ta.selectionEnd;
  if(s0 === s1){
    ta.focus();
    toast('先在文本框里选中要加粗的文字，再点 B');
    return;
  }
  const v = ta.value, sel = v.slice(s0, s1);
  const already = sel.length > 4 && sel.startsWith('**') && sel.endsWith('**');
  const rep = already ? sel.slice(2, -2) : '**' + sel + '**';
  ta.value = v.slice(0, s0) + rep + v.slice(s1);
  ta.focus();
  ta.selectionStart = s0;
  ta.selectionEnd = s0 + rep.length;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
});

editorEl.addEventListener('change', e=>{
  const t = e.target;

  /* 联系项类型：切换后可能要显示/收起「自定义前缀」输入框，重绘左栏 */
  if(t.tagName === 'SELECT' && t.dataset.cidx != null){
    const i = +t.dataset.cidx;
    if(!state.meta.contacts || !state.meta.contacts[i]) return;
    state.meta.contacts[i].kind = t.value;
    syncContact(); renderEditor(); renderPreview(); checkOverflow(); applyZoom(); save();
    return;
  }

  const p = e.target.dataset.path;
  if(!p) return;
  if(e.target.tagName === 'SELECT'){
    setPath(p, e.target.value);
    save();
    return;
  }
  if(e.target.type === 'checkbox'){
    setPath(p, e.target.checked);
    renderPreview(); save();
  }
});

editorEl.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;

  /* AI：System Prompt 的「填入默认 / 恢复默认」（不在模块卡片里，先处理） */
  if(btn.dataset.promptAct){
    const fill = btn.dataset.promptAct === 'fill';
    state.ai.systemPrompt = fill ? AI_SYSTEM : '';
    const ta = editorEl.querySelector('textarea[data-path="ai.systemPrompt"]');
    if(ta) ta.value = state.ai.systemPrompt;
    syncSysState(); save();
    toast(fill ? '已填入内置默认，可在上面继续改' : '已清空，回到内置默认');
    return;
  }

  /* 折叠 / 展开：固定面板（data-fold）与模块卡片（data-act="fold"） */
  if(btn.dataset.fold){
    toggleFold(btn.dataset.fold);
    return;
  }

  /* 排版恢复默认 */
  if(btn.id === 'btnLayoutReset'){
    /* 版式是「用户挑的模板」，恢复默认只把字号 / 行距 / 模块距拉回来，不擅自换回经典单栏 */
    state.layout = { fs: 9.3, lh: 1.55, gap: 10, editorW: 430, preset: 'standard', tpl: tplId() };
    renderEditor(); applyLayout(); syncLabels(); applyZoom(); checkOverflow(); save();
    toast('字号 / 行距 / 模块距已恢复默认');
    return;
  }

  /* 版式模板切换：只换骨架，字号 / 行距 / 主题都不动 */
  if(btn.dataset.tpl){
    state.layout.tpl = btn.dataset.tpl;
    renderEditor(); applyLayout(); renderPreview(); applyZoom(); save();
    toast('已切换版式：' + tplName(btn.dataset.tpl));
    return;
  }

  /* 排版预设 */
  if(btn.dataset.preset){
    const p = presetOf(btn.dataset.preset);
    if(!p) return;
    state.layout = Object.assign({}, state.layout, p.layout, { preset: p.id });
    renderEditor(); applyLayout(); syncLabels(); checkOverflow(); applyZoom(); save();
    toast('已套用排版：' + p.name);
    return;
  }

  /* 主题切换 */
  if(btn.dataset.theme){
    state.theme = btn.dataset.theme;
    applyTheme();
    renderEditor();
    save();
    toast('已切换主题：' + themeOf(state.theme).name);
    return;
  }

  /* AI：收放 API 设置 */
  if(btn.id === 'btnAiCfg'){
    aiCfgOpen = !aiCfgOpen;
    renderEditor();
    return;
  }

  /* AI：生成建议 */
  if(btn.id === 'btnAiRun'){ runAi(state.ai.scope); return; }

  /* AI：全部采用 */
  if(btn.id === 'btnAiApplyAll'){
    const list = aiResult ? aiResult.changes.slice() : [];
    list.forEach(c=> setPath(c.path, c.newText));
    if(aiResult) aiResult.changes = [];
    renderEditor(); renderPreview(); checkOverflow(); applyZoom(); save();
    if(list.length) toast('已应用 ' + list.length + ' 处改动');
    return;
  }

  /* AI：全部忽略 */
  if(btn.id === 'btnAiDrop'){
    aiResult = null;
    renderAiResult();
    toast('已忽略全部建议');
    return;
  }

  /* AI：单条采用 / 忽略 */
  if(btn.dataset.dchg != null){
    const idx = +btn.dataset.dchg;
    if(!aiResult || !aiResult.changes[idx]) return;
    const c = aiResult.changes[idx];
    if(btn.dataset.skip){
      aiResult.changes.splice(idx, 1);
      renderAiResult();
      return;
    }
    setPath(c.path, c.newText);
    aiResult.changes.splice(idx, 1);
    renderEditor(); renderPreview(); checkOverflow(); applyZoom(); save();
    toast('已采用：' + c.label);
    return;
  }

  /* 联系行：加一条 / 删一条 */
  if(btn.dataset.cact === 'add'){
    state.meta.contacts = state.meta.contacts || [];
    state.meta.contacts.push({ kind: 'custom', label: '', text: '' });
    syncContact(); renderEditor(); renderPreview(); checkOverflow(); applyZoom(); save();
    return;
  }
  if(btn.dataset.cact === 'del'){
    const ci = +btn.dataset.cidx;
    state.meta.contacts.splice(ci, 1);
    syncContact(); renderEditor(); renderPreview(); checkOverflow(); applyZoom(); save();
    return;
  }

  const modEl = btn.closest('.mod');
  const id = modEl && modEl.dataset.mod;
  const act = btn.dataset.act;
  const i = btn.dataset.i != null ? +btn.dataset.i : null;
  const b = btn.dataset.b != null ? +btn.dataset.b : null;

  /* 新增模块 */
  if(btn.dataset.add){
    addModule(btn.dataset.add);
    return;
  }

  if(!id || !act) return;
  const m = state.modules[id];

  /* AI：从模块卡片触发，选中该模块后可一键跑 */
  if(act === 'aiScope'){
    state.ai.scope = id;
    renderEditor(); save();
    const panel = document.getElementById('panelAi');
    if(panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if(!state.ai.key || !state.ai.key.trim() || !state.ai.jd || !state.ai.jd.trim()){
      toast('已选中「' + m.title + '」，先填 Key 和 JD');
    } else {
      runAi(id);
    }
    return;
  }

  if(act === 'up' || act === 'down'){
    const idx = state.order.indexOf(id);
    const to = act === 'up' ? idx - 1 : idx + 1;
    if(to < 0 || to >= state.order.length) return;
    state.order.splice(idx, 1);
    state.order.splice(to, 0, id);
    renderEditor(); renderPreview(); renderRail(); save();
  }
  else if(act === 'fold'){
    toggleFold('m-' + id);
    return;
  }
  else if(act === 'toggle'){
    m.visible = !m.visible;
    renderEditor(); renderPreview(); renderRail(); save();
  }
  else if(act === 'delModule'){
    if(state.order.length <= 1){ toast('至少保留一个模块'); return; }
    if(!confirm('删除模块「' + m.title + '」？内容不可恢复。')) return;
    state.order = state.order.filter(x=> x !== id);
    delete state.modules[id];
    renderEditor(); renderPreview(); renderRail(); save();
  }
  else if(act === 'addItem'){
    m.items.push(newItem(m.style));
    renderEditor(); renderPreview(); save();
  }
  else if(act === 'delItem'){
    m.items.splice(i, 1);
    renderEditor(); renderPreview(); save();
  }
  else if(act === 'addBullet'){
    m.items[i].bullets = m.items[i].bullets || [];
    m.items[i].bullets.push(mkBullet());
    renderEditor(); renderPreview(); save();
  }
  else if(act === 'delBullet'){
    m.items[i].bullets.splice(b, 1);
    renderEditor(); renderPreview(); save();
  }
  else if(act === 'toggleBullet'){
    const bl = m.items[i] && m.items[i].bullets ? m.items[i].bullets[b] : null;
    if(!bl) return;
    bl.visible = bl.visible === false;      // 取反：false → true，其余 → false
    renderEditor(); renderPreview(); checkOverflow(); save();
  }
});

function newItem(style){
  if(style === 'edu') return { text: '', time: '' };
  if(style === 'project') return { name: '', meta: '', stack: '', desc: '', bullets: [mkBullet()] };
  if(style === 'intern') return { company: '', role: '', time: '', bullets: [mkBullet()] };
  if(style === 'list') return { label: '', text: '' };
  return { text: '' };
}

function addModule(style){
  const titles = { project:'新增项目', list:'新增技能组', edu:'新增教育', intern:'新增经历', para:'新增段落' };
  const id = nextId();
  state.modules[id] = { title: titles[style], style, visible: true, items: [newItem(style)] };
  state.order.push(id);
  renderEditor(); renderPreview(); renderRail(); save();
  toast('已添加「' + titles[style] + '」');
}

/* =====================================================================
   7. 缩放
   ===================================================================== */
let zoom = 1, fitMode = true;
const pvScroll = document.getElementById('pvScroll');
const pageWrap = document.getElementById('pageWrap');

function applyZoom(){
  if(fitMode){
    const avail = pvScroll.clientWidth - 48;
    const pageW = pageEl.offsetWidth || 794;
    zoom = Math.min(1, Math.max(0.45, avail / pageW));
  }
  pageEl.style.transform = 'scale(' + zoom + ')';
  pageWrap.style.width = (pageEl.offsetWidth * zoom) + 'px';
  pageWrap.style.height = (pageEl.offsetHeight * zoom) + 'px';
  document.getElementById('zoomVal').textContent = Math.round(zoom * 100) + '%';
}
document.getElementById('zoomIn').onclick = ()=>{ fitMode = false; zoom = Math.min(1.6, zoom + 0.1); applyZoom(); };
document.getElementById('zoomOut').onclick = ()=>{ fitMode = false; zoom = Math.max(0.4, zoom - 0.1); applyZoom(); };
document.getElementById('zoomFit').onclick = ()=>{ fitMode = true; applyZoom(); };
window.addEventListener('resize', ()=>{ applyZoom(); fitPdfPreview(); });

/* =====================================================================
   8. 导出 / 导入 / 打印
   ===================================================================== */
/* ---------- 导出为独立 HTML ---------- */
/* 生成一份语义化简历 HTML：h1 姓名 → 3 个 p（求职意向 / 联系行 / 摘要）→ h2 分段 → h3 项目 → p → ul li。
   用途有两个：直接用浏览器打开 / 当附件投递；以及被本工具的「导入 HTML」原样读回来继续编辑。
   样式和当前预览一致（同一套变量：字号、行距、模块距、主题色都按当前设置写死进去）。 */
const EXPORT_CSS = `*{box-sizing:border-box}

function exportHtmlSource(){
  const m = state.meta;
  const L = state.layout || {};
  const t = themeOf(state.theme);
  const tpl = tplId();
  const vars = [
    '--fs:' + (L.fs || 9.3) + 'pt',
    '--lh:' + (L.lh || 1.55),
    '--gap:' + (L.gap || 10) + 'pt',
    '--accent:' + t.accent,
    '--accent-deep:' + t.deep,
    '--accent-strong:' + t.strong,
    '--accent-bg:' + t.bg,
    '--accent-line:' + t.accent + '3d',
    '--ink-main:' + t.ink,
    '--ink-sub:' + t.sub,
    '--ink-soft:' + t.soft
  ].join(';');

  /* 正文与右侧预览走同一个生成函数，版式不同也不会出现「预览一套、导出另一套」；
     导出前把只在编辑器里用的定位/拖拽属性摘掉，存出来的 HTML 保持干净 */
  const body = buildBody(tpl)
    .replace(/ draggable="true"/g, '')
    .replace(/ data-(sec|item|bi)="[^"]*"/g, '');

  const shortTitle = String(m.jobTitle || '').split(/[｜|]/)[0].trim();
  const docTitle = [m.name, shortTitle].filter(Boolean).join(' - ');

  return '<!doctype html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
    + '<title>' + esc(docTitle || '简历') + '</title>\n'
    + '<style>\n' + EXPORT_CSS + '\n' + tplCss('.resume') + '\n</style>\n</head>\n<body>\n'
    + '<main class="resume' + (tpl === 'classic' ? '' : ' tpl-' + tpl) + '" style="' + vars + '">\n'
    + body + '\n</main>\n</body>\n</html>\n';
}

function exportHtml(){
  const src = exportHtmlSource();
  const blob = new Blob([src], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = resumeFileName() + '.html';
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
  toast('已导出 HTML（能直接打开，也能再导入本工具继续改）');
}

/* 打印/位图导出前先把纸面「冻结」：指针还停在纸面上也不会再亮起悬停底色，
   否则底色会被打印/截图写进 PDF（曾出现整页淡紫底） */
function lockPageHover(on){ document.body.classList.toggle('printing', !!on); }

/* 打印路径：系统打印 → 矢量 PDF（文字可选中、可被 ATS 解析） */
function exportPdf(){
  syncDocTitle();          /* 「另存为 PDF」的默认文件名取自文档标题，打印前再兜一次 */
  toast('打印窗口已打开：目标「另存为 PDF」 · 纸张 A4 · 边距「无」 · 缩放保持默认；技术栈底条已强制打印，不用勾「背景图形」');
  lockPageHover(true);
  window.addEventListener('afterprint', ()=> lockPageHover(false), { once:true });
  /* 打印对话框关闭后兜底解锁：个别环境不派发 afterprint */
  setTimeout(()=>{ window.print(); setTimeout(()=> lockPageHover(false), 600); }, 340);
}

/* ============ 导出前预览：大窗口确认，再生成 PDF ============ */
const pdfModalEl = document.getElementById('pdfModal');
const pdfModalPageEl = document.getElementById('pdfModalPage');
const pdfModalWrapEl = document.getElementById('pdfModalWrap');

function fitPdfPreview(){
  if(pdfModalEl.hidden) return;
  const stage = document.getElementById('pdfModalStage');
  const pw = pdfModalPageEl.offsetWidth || 794;
  const ph = pdfModalPageEl.offsetHeight || 1122;
  const availW = Math.max(240, stage.clientWidth - 36);
  const availH = Math.max(240, stage.clientHeight - 36);
  const s = Math.min(availW / pw, availH / ph, 1.8);
  pdfModalPageEl.style.transform = 'scale(' + s + ')';
  pdfModalWrapEl.style.width = Math.round(pw * s) + 'px';
  pdfModalWrapEl.style.height = Math.round(ph * s) + 'px';
}

/* A4 页面用到的全部 CSS 变量，克隆时必须整套搬过去（漏一个就会掉色 / 版式走形） */
const PAGE_VARS = ['--fs','--lh','--gap','--accent','--accent-deep','--accent-strong','--accent-bg',
  '--accent-line','--ink-main','--ink-sub','--ink-soft'];

function openPdfPreview(){
  /* 预览用的是一份克隆：尺寸、字号、主题变量、版式 class 都照搬右侧 A4，改不到真实页面 */
  pdfModalPageEl.innerHTML = pageEl.innerHTML;
  pdfModalPageEl.className = pageEl.className;             /* tpl-* 版式跟着走 */
  PAGE_VARS.forEach(v=>{
    const val = pageEl.style.getPropertyValue(v);
    if(val) pdfModalPageEl.style.setProperty(v, val);
  });
  const st = document.getElementById('pdfModalState');
  const src = document.getElementById('pageState');
  st.textContent = src ? src.textContent : '单页';
  st.className = 'st' + (src && src.classList.contains('ok') ? '' : ' bad');
  pdfModalEl.hidden = false;
  fitPdfPreview();
}

function closePdfPreview(){ pdfModalEl.hidden = true; }

pdfModalEl.addEventListener('mousedown', e=>{ if(e.target === pdfModalEl) closePdfPreview(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && !pdfModalEl.hidden) closePdfPreview(); });

/* 复制一份干净的 A4 页面到独立舞台（供位图导出与自测共用）：
   html2canvas 对 position:fixed 的克隆元素裁剪会错位（导出成左侧窄条、其余空白），
   所以导出期间把顶栏与主体临时隐藏，让这个 A4 盒子落在文档 (0,0) 的正常位置上。 */
function buildExportBox(){
  const stage = document.createElement('div');
  stage.style.cssText = 'background:#ffffff;margin:0;padding:0';
  const box = document.createElement('div');
  box.className = pageEl.className || 'page';   /* 带上 tpl-*，位图 PDF 才和预览同一版式 */
  /* 高度取 1122px（略小于 297mm=1122.5px），否则按宽铺满 A4 时会溢出半像素、多出一张空白页 */
  box.style.cssText = 'transform:none;box-shadow:none;margin:0;height:1122px;min-height:0;overflow:hidden';
  /* 把页面上的排版与主题变量带过来，否则新盒子用的是 CSS 默认值 */
  PAGE_VARS.forEach(v=>{
    const val = pageEl.style.getPropertyValue(v);
    if(val) box.style.setProperty(v, val);
  });
  box.innerHTML = pageEl.innerHTML;
  stage.appendChild(box);

  /* 只在文档流里放这一个 A4 盒子：body 改成 block（页面可能是 flex 居中，会让克隆体在
     html2canvas 的宽视口副本里被推偏），顶栏与主体先隐藏，渲染完再恢复 */
  const hides = [document.querySelector('.topbar'), document.querySelector('.main'),
                 document.getElementById('toast'), document.getElementById('pdfModal')];
  const prev = hides.map(el=> el ? el.style.display : null);
  const bodyPrev = document.body.style.display;
  const bodyMarginPrev = document.body.style.margin;
  document.body.style.display = 'block';
  document.body.style.margin = '0';          /* 默认 8px 边距会把盒子推离原点，取景就带白边 */
  hides.forEach(el=>{ if(el) el.style.display = 'none'; });
  document.body.appendChild(stage);

  const restore = ()=>{
    hides.forEach((el, i)=>{ if(el) el.style.display = prev[i] || ''; });
    document.body.style.display = bodyPrev;
    document.body.style.margin = bodyMarginPrev;
    stage.remove();
  };
  return { stage, box, restore };
}

/* 主路径：先大窗预览，确认后直接生成 PDF 文件（不弹打印窗口）。
   自己拼 html2canvas + jsPDF，不用 html2pdf 的容器：容器会把 A4 盒按页宽重排，取景就偏。 */
function exportImgPdf(){
  const hasLib = typeof html2canvas !== 'undefined' && window.jspdf && window.jspdf.jsPDF;
  if(!hasLib){
    toast('PDF 组件未加载（需联网），已改用打印导出');
    lockPageHover(true);
    window.addEventListener('afterprint', ()=> lockPageHover(false), { once:true });
    setTimeout(()=>{ window.print(); setTimeout(()=> lockPageHover(false), 600); }, 200);
    return;
  }
  const btn = document.getElementById('pdfConfirm');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '生成中…';

  const { box, restore } = buildExportBox();
  lockPageHover(true);            /* 截图期间纸面不再响应指针，底色不会被算进 canvas */

  const done = close=>{
    restore();
    lockPageHover(false);
    btn.disabled = false; btn.textContent = old;
    if(close) closePdfPreview();
  };

  const run = async ()=>{
    try{
      /* 显式给出取景区域：元素自身的文档坐标 + 元素尺寸。
         不再依赖 html2canvas 从视口宽度推断（真实浏览器窗口变宽时，canvas 会被拉宽、内容挤到左边） */
      const r = box.getBoundingClientRect();
      const w = Math.round(r.width);
      const h = Math.round(r.height);
      const x = Math.round(r.left + window.scrollX);
      const y = Math.round(r.top + window.scrollY);

      const canvas = await html2canvas(box, {
        /* 2.5 倍 ≈ 240dpi；3 倍 ≈ 288dpi。取 2.5 是清晰度与生成耗时的折中 */
        scale: 2.5, useCORS: true, backgroundColor: '#ffffff',
        x: x, y: y, width: w, height: h,
        scrollX: 0, scrollY: 0,
        windowWidth: Math.max(document.documentElement.clientWidth, x + w + 4),
        windowHeight: Math.max(document.documentElement.clientHeight, y + h + 4)
      });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      const PW = 210, PH = 297;
      const imgH = PW * canvas.height / canvas.width;
      const data = canvas.toDataURL('image/jpeg', 0.96);

      if(imgH <= PH + 0.6){
        /* 单页：按 A4 宽等比，高度取实际比例，不硬拉满 */
        pdf.addImage(data, 'JPEG', 0, 0, PW, Math.min(imgH, PH));
      } else {
        /* 内容超过一页时按页高切片，避免尾部多出空白页 */
        const pxPerMm = canvas.width / PW;
        const pageHpx = Math.floor(PH * pxPerMm);
        let off = 0, page = 0;
        while(off < canvas.height){
          const slice = document.createElement('canvas');
          slice.width = canvas.width;
          slice.height = Math.min(pageHpx, canvas.height - off);
          slice.getContext('2d').drawImage(canvas, 0, off, canvas.width, slice.height,
            0, 0, canvas.width, slice.height);
          if(page > 0) pdf.addPage();
          pdf.addImage(slice.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, PW,
            slice.height / pxPerMm);
          off += pageHpx; page++;
        }
      }

      /* 统一命名：姓名-求职意向-简历 */
      pdf.save(resumeFileName() + '.pdf');
      done(true);
    }catch(err){
      console.error(err); done(false);
      toast('导出失败，请改用「打印 · 矢量」另存为 PDF');
    }
  };

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=> setTimeout(run, 80));
  } else {
    setTimeout(run, 80);
  }
}

document.getElementById('btnPdf').onclick = openPdfPreview;
document.getElementById('btnImgPdf').onclick = exportPdf;
document.getElementById('pdfCancel').onclick = closePdfPreview;
document.getElementById('pdfConfirm').onclick = ()=> exportImgPdf();
